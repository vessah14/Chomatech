server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Images envoyées depuis l'admin (jusqu'à 5 Mo côté API) : la limite nginx par défaut (1 Mo)
    # les refuserait avec une erreur 413.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API et images téléversées : servies par le backend, sur la MÊME origine que le site
    # (pas de CORS, le cookie de session SameSite=Strict est envoyé normalement).
    # Pas de "/" final après le port : le chemin /api/... est transmis tel quel au backend.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Fichiers de build versionnés (nom avec hash) : cache long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute autre adresse renvoie index.html (React Router gère la suite).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
