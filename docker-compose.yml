# CHOMA TECH — environnement complet en conteneurs (développement / démonstration).
#
#   docker compose up -d --build      puis :  site → http://localhost:5173
#                                             administration → http://localhost:5174
#
# Réglages : copier .env.example en .env et l'adapter (tout a une valeur par défaut locale).
# Ce fichier vise un poste de développement : pour une mise en production, voir README.md.

name: chomatech

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chomatech}
      POSTGRES_USER: ${POSTGRES_USER:-chomatech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chomatech-dev}
    volumes:
      # PostgreSQL 18 : le volume se monte sur /var/lib/postgresql (et non plus .../data).
      - db_data:/var/lib/postgresql
      # Structure de la base (sans données), appliquée au tout premier démarrage.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Accès depuis l'hôte (pgAdmin, DBeaver...). 5433 pour ne pas gêner un PostgreSQL local sur 5432.
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      # Premier démarrage : initialisation du volume + application du schéma avant d'être prêt.
      start_period: 60s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development : cookies sans "Secure" (le site est servi en http://localhost) et liens de
      # réinitialisation affichés dans les logs tant que Brevo n'est pas configuré.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-chomatech};Username=${POSTGRES_USER:-chomatech};Password=${POSTGRES_PASSWORD:-chomatech-dev};GSS Encryption Mode=Disable
      Jwt__Key: ${JWT_KEY:-dev-uniquement-cle-locale-a-remplacer-0123456789abcdef}
      App__SiteUrl: ${SITE_URL:-http://localhost:${SITE_PORT:-5173}}
      SasPay__BaseUrl: ${SASPAY_BASE_URL:-https://api.saspay.me/api/v1/}
      SasPay__ApiKey: ${SASPAY_API_KEY:-}
      SasPay__Country: ${SASPAY_COUNTRY:-CM}
      SasPay__Currency: ${SASPAY_CURRENCY:-XAF}
      SasPay__WebhookSecret: ${SASPAY_WEBHOOK_SECRET:-}
      # Premier administrateur, créé seulement si la base n'en contient aucun.
      Bootstrap__AdminEmail: ${ADMIN_EMAIL:-admin@chomatech.local}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:-Admin-Chomatech-2026}
      # nginx (sites) relaie les requêtes : on lui fait confiance pour l'IP réelle des visiteurs
      # (limite de tentatives par IP). Réseaux privés Docker uniquement.
      ReverseProxy__KnownNetworks__0: 172.16.0.0/12
      ReverseProxy__KnownNetworks__1: 192.168.0.0/16
      # Facultatif : emails (Brevo) et connexion Google/Facebook. Vide = désactivé.
      Brevo__ApiKey: ${BREVO_API_KEY:-}
      Brevo__SenderEmail: ${BREVO_SENDER_EMAIL:-}
      Brevo__SenderName: ${BREVO_SENDER_NAME:-CHOMA TECH}
      Brevo__NewsletterListId: ${BREVO_NEWSLETTER_LIST_ID:-0}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Facebook__AppId: ${FACEBOOK_APP_ID:-}
      Authentication__Facebook__AppSecret: ${FACEBOOK_APP_SECRET:-}
    volumes:
      - uploads:/app/wwwroot/uploads
    # Pas de port publié : l'API n'est joignable qu'à travers nginx (même origine que les sites).

  site:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${SITE_PORT:-5173}:80"

  admin:
    build:
      context: ./Administration
      args:
        # Lien "Mot de passe oublié ?" de la page de connexion admin (page du site client).
        VITE_SITE_URL: http://localhost:${SITE_PORT:-5173}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT:-5174}:80"

volumes:
  db_data:
  uploads:
